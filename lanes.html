<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Tini Delivery Run — Lanes</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Tini Delivery Run <span class="version">Lane version</span></h1>
    <canvas id="game" width="900" height="400" aria-label="Tini Delivery Run game, lane version"></canvas>
    <div class="controls">
      <button id="btn-up" class="control" type="button" aria-label="Move up a lane">▲</button>
      <button id="btn-down" class="control" type="button" aria-label="Move down a lane">▼</button>
    </div>
    <ul class="help">
      <li><kbd>↑</kbd> / <kbd>↓</kbd> to change lane — or tap the top or bottom half of the game</li>
      <li>Steer onto the delivery bay that matches your van's colour to deliver</li>
      <li>Steer around the wrong bays, potholes, oncoming cars and swooping birds</li>
    </ul>
    <p class="switch"><a href="index.html">Play the jump version instead</a></p>
  </main>
  <script src="js/game-lanes.js"></script>
</body>
</html>

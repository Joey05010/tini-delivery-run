<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Tini Delivery Run</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Tini Delivery Run <span class="version">Jump version</span></h1>
    <canvas id="game" width="900" height="320" aria-label="Tini Delivery Run game"></canvas>
    <div class="controls single">
      <button id="btn-jump" class="control" type="button">Jump</button>
    </div>
    <ul class="help">
      <li><kbd>Space</kbd> / <kbd>↑</kbd> / tap to jump — hold for a higher jump</li>
      <li>Drive over the delivery bay that matches your van's colour to deliver</li>
      <li>Jump over the wrong bays, potholes and oncoming cars — stay down for birds</li>
    </ul>
    <p class="switch"><a href="lanes.html">Play the lane version instead</a></p>
  </main>
  <script src="js/game.js"></script>
</body>
</html>
